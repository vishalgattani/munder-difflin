name: Sync main with upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'vishalgattani/munder-difflin'
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward main to HarnessMD/munder-difflin main
        env:
          # SYNC_TOKEN (PAT with repo+workflow) is needed when upstream changes .github/workflows
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: gh api repos/${{ github.repository }}/merge-upstream -X POST -f branch=main
